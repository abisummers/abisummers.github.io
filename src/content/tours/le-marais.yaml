sections:
  - title: Itinerary
    content: |-
      Along the route, I'll give some historical context to why the neighbourhood is like this today. I'll share with you why I love this neighbourhood and how to get the best out of your time here. We'll visit the highlights of the neighbourhood, along with some of the lesser known places.
      
      Some of the stops are:
      - medieval houses
      - remains of an old city wall
      - the Saint Paul village
      - Place des Vosges

      ...and more!

      **Meeting location**: St-Gervais-et-St-Protais Church of Paris
