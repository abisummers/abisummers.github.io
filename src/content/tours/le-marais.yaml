order: 4
name: Le Marais
description: |-
 Le Marais is one of the most historic neighbourhoods of Paris. As we walk through the streets, you'll discover some of the history that is in plain sight from the medieval houses to the _hôtel particulier_. Today, it is one of the most popular places to stay in while visiting Paris and you'll understand why! There are some great places to eat and drink, and there are a lot of great museums within walking distance of each other.
