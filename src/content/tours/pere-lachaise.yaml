order: 4
name: People of Père Lachaise | Private tour
description: |-
  Take a scenic walk through the Père Lachaise cemetery and discover the lives of some of the people who are buried there!

  There are over 70,000 people buried here from famous musicians, to painters and historical figures. It's somewhat of a destination to trace the lives of people you admire for many tourists and locals alike.
