  - src: "/src/content/tours/images/pere-lachaise-2.jpg"
    alt: The grave of Fulgence Bienvenüe, the engineer of the Paris metro, in Père Lachaise
  - src: "/src/content/tours/images/pere-lachaise-3.jpg"
    alt: The grave of Frédéric Chopin, the famous composer, in Père Lachaise
sections:
  - title: Itinerary
    content: |-
      Explore some of the famous people buried in Père Lachaise, including Edith Piaf and Oscar Wilde.

      In the additional information section, let me know if there's any specific people or themes (musicians, women, notable graves) that you'd like to discover.

      **Meeting location**: Metro station Alexandre Dumas.
