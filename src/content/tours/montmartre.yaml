order: 3
name: Exploring Montmartre | Private tour
description: |-
  Montmartre is one of my favourite neighbourhoods in Paris! It's one of the areas that most tourists want to visit, but it's so much more than just the places you see on Instagram. I'll show you some of the places where the locals hang out, and give tips on how to really enjoy this area.

  I'll talk to you a bit about the history of this area and how that has impacted the version of Montmartre that we love today.
images:
  - src: "/src/content/tours/images/montmartre-1.jpg"
    alt: A wintery day in Montmartre looking at the Sacré-Cœur
  - src: "/src/content/tours/images/montmartre-2.jpg"
    alt: A cozy street in Montmartre
sections:
  - title: Itinerary
    content: |-
      We'll visit some of the main attractions in Montmartre including:

      - the moulin rouge: one of the most iconic cabarets in the world
      - Place du Tertre: a place to see artists working
      - Sacre Cœur: the church at the top of the hill (which is a controversial landmark amongst the Parisians)

      Plus some hidden gems!

      At each location, I'll share stories about the history of the place and some of the important people.

      This route can be adjusted based on what you'd like to see and what you're the most interested in!

      **Meeting location**: metro station Blanche
